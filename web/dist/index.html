<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <title>Jogar contra Aronian</title>
  <link rel="icon" href="/pieces/bN.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <div class="controls">
      <div class="color-choice" role="group" aria-label="Escolha sua cor">
        <button type="button" data-color="white" aria-pressed="true"><span class="color-dot white-dot"></span>Brancas</button>
        <button type="button" data-color="black" aria-pressed="false"><span class="color-dot black-dot"></span>Pretas</button>
      </div>
      <button type="button" id="restart" class="restart">Nova partida</button>
    </div>
    <div id="board" class="board" role="group" aria-label="Tabuleiro de xadrez"></div>
    <div class="footer">
      <p id="status" role="status" aria-live="polite">Carregando a partida…</p>
      <span class="opponent">Modelo Aronian</span>
    </div>
  </main>
  <dialog id="promotion">
    <form method="dialog">
      <p>Promover peão para</p>
      <div id="promotion-options" class="promotion-options"></div>
      <button type="submit" class="cancel">Cancelar</button>
    </form>
  </dialog>
</body>
</html>
